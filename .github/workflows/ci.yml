name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each dependency cache has its own restore and save steps. The steps have a
# 2-minute timeout and continue on error, so an unavailable cache service costs
# at most 2 minutes and a cold build. A setup action's built-in cache cannot be
# bounded apart from the tool download, so each setup action disables it.
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        shell: bash
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - name: Full race suite with owned Unix fixtures
        id: store-unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-identity-store-unix.sh race ${{ runner.os == 'Linux' && 'linux' || 'darwin' }} ${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
      - name: Full race suite with owned Windows fixtures
        id: store-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-identity-store-windows.ps1 -FixtureProfile race -ExpectedArchitecture amd64
      - name: Preserve identity store evidence
        if: always() && (steps.store-unix.outputs.evidence-path != '' || steps.store-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-store-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/volume/**
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/fixture.vhdx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: go vet ./...
      - run: go build -trimpath -o bin/oe${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/oe
      - name: Native npm package install
        run: npm run test:native -- bin/oe${{ runner.os == 'Windows' && '.exe' || '' }}
      - if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Keep the documented minimum Go line buildable while release builds use
  # the current stable patch release.
  minimum-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - name: Minimum Go full suite and six CGO0 builds
        id: store-unix
        shell: bash
        run: bash scripts/test-identity-store-unix.sh minimum linux amd64
      - name: Preserve identity store evidence
        if: always() && (steps.store-unix.outputs.evidence-path != '' || steps.store-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-store-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/volume/**
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/fixture.vhdx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Each cell runs actual native CGO0 storage code. Windows arm64 has no race cell.
  identity-store-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: linux, arch: arm64 }
          - { os: macos-26, target: darwin, arch: arm64 }
          - { os: macos-26-intel, target: darwin, arch: amd64 }
          - { os: windows-2025, target: windows, arch: amd64 }
          - { os: windows-11-arm, target: windows, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.target == 'darwin' && matrix.arch == 'amd64' && 45 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Native Unix storage suite
        id: store-unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-identity-store-unix.sh native ${{ matrix.target }} ${{ matrix.arch }}
      - name: Native Windows storage suite
        id: store-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-identity-store-windows.ps1 -FixtureProfile native -ExpectedArchitecture ${{ matrix.arch }}
      - name: Preserve identity store evidence
        if: always() && (steps.store-unix.outputs.evidence-path != '' || steps.store-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-store-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/volume/**
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/fixture.vhdx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Each cell qualifies the real ordinary account and its actual default root.
  identity-default-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: linux, arch: arm64 }
          - { os: macos-26, target: darwin, arch: arm64 }
          - { os: macos-26-intel, target: darwin, arch: amd64 }
          - { os: windows-2025, target: windows, arch: amd64 }
          - { os: windows-11-arm, target: windows, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Actual ordinary Unix default location
        id: default-unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-identity-default-unix.sh ${{ matrix.target }} ${{ matrix.arch }}
      - name: Newly logged-on standard Windows default location
        id: default-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-identity-default-windows.ps1 -ExpectedArchitecture ${{ matrix.arch }}
      - name: Preserve bounded default-location evidence
        if: always() && (steps.default-unix.outputs.evidence-path != '' || steps.default-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-default-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ steps.default-unix.outputs.evidence-path || steps.default-windows.outputs.evidence-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The config loader runs on the node on PATH. It must work on the oldest
  # supported Node.js and on the current release.
  config-node:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "26.12.1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: go test -count=1 ./internal/config
      - if: steps.go-cache.outputs.cache-hit != 'true' && matrix.node == '26.12.1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - run: go mod tidy -diff
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run format:check
      - if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  homebrew:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/test-homebrew.sh

  # RI-D401: temporary diagnostics only. Remove both jobs before final merge.
  identity-default-loader-gui-amd64:
    name: Temporary Windows amd64 loader/GUI observation (diagnostic only, no D credit)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Diagnostic only - fixed Go loader/GUI observation
        id: observation
        shell: pwsh
        run: ./scripts/test-identity-default-windows.ps1 -ExpectedArchitecture amd64 -DiagnosticLoaderGUI
      - name: Preserve bounded diagnostic-only loader/GUI observation evidence
        if: always() && steps.observation.outputs.evidence-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-default-loader-gui-windows-amd64
          path: ${{ steps.observation.outputs.evidence-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  identity-default-loader-gui-arm64:
    name: Temporary Windows arm64 loader/GUI observation (diagnostic only, no D credit)
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Diagnostic only - fixed Go loader/GUI observation
        id: observation
        shell: pwsh
        run: ./scripts/test-identity-default-windows.ps1 -ExpectedArchitecture arm64 -DiagnosticLoaderGUI
      - name: Preserve bounded diagnostic-only loader/GUI observation evidence
        if: always() && steps.observation.outputs.evidence-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-default-loader-gui-windows-arm64
          path: ${{ steps.observation.outputs.evidence-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
