name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # The schedule and a manual dispatch run every native cell on main.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's earlier run. Every
# other run has its own group, keyed by run ID, so no main run waits for or
# cancels another run, and each main commit keeps its own evidence.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each dependency cache has its own restore and save steps. The steps have a
# 2-minute timeout and continue on error, so an unavailable cache service costs
# at most 2 minutes and a cold build. A setup action's built-in cache cannot be
# bounded apart from the tool download, so each setup action disables it.
jobs:
  # The native identity cells compile only the ./internal/identityattempt test
  # binary and run only the identity harness scripts. This job selects them when
  # a change touches that build closure, the harness, the module files or this
  # workflow. A tracked symlink or submodule anywhere also selects them, because
  # the harness refuses one. Any uncertainty selects every native cell.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.classify.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Classify the identity build closure
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Bash ignores errexit inside a function that an if tests, so each
          # command in classify returns its own failure.
          classify() {
            local range root target tags dir meta path mode
            case "$EVENT" in
              pull_request) range="$BASE...$HEAD" ;;
              push)
                if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
                  echo "The push has no previous commit." >&2
                  return 1
                fi
                range="$BEFORE..$HEAD"
                ;;
              *)
                echo "The $EVENT event runs every native cell." >&2
                return 1
                ;;
            esac
            root=$(go list -m -f '{{.Dir}}') || return 1
            : > "$RUNNER_TEMP/identity-dirs"
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              for tags in "" identity_default_qualification; do
                GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go list -tags "$tags" -deps -test \
                  -f '{{if not .Standard}}{{.Dir}}{{end}}' ./internal/identityattempt \
                  >> "$RUNNER_TEMP/identity-dirs" || return 1
              done
            done
            prefixes=()
            while IFS= read -r dir; do
              if [[ "$dir" == "$root" ]]; then
                prefixes+=("")
              elif [[ "$dir" == "$root"/* ]]; then
                prefixes+=("${dir#"$root"/}/")
              fi
            done < <(sort -u "$RUNNER_TEMP/identity-dirs")
            if [[ ${#prefixes[@]} -eq 0 ]]; then
              echo "The build closure has no repository directory." >&2
              return 1
            fi
            echo "Build closure directories: ${prefixes[*]}" >&2
            git diff --no-renames --raw -z "$range" > "$RUNNER_TEMP/identity-diff" || return 1
            # A case-insensitive checkout can put a differently cased path in
            # a closure directory, so the match ignores case.
            shopt -s nocasematch
            while IFS= read -r -d "" meta && IFS= read -r -d "" path; do
              mode=${meta#:* }
              mode=${mode%% *}
              if [[ "$mode" == 120000 || "$mode" == 160000 ]]; then
                echo "Selected by a tracked symlink or submodule: $path" >&2
                echo true
                return 0
              fi
              case "$path" in
                go.mod | go.sum | go.work | go.work.sum | .github/workflows/ci.yml | scripts/identity-* | scripts/test-identity-*)
                  echo "Selected by $path" >&2
                  echo true
                  return 0
                  ;;
              esac
              for dir in "${prefixes[@]}"; do
                if [[ "$path" == "$dir"* ]]; then
                  echo "Selected by $path" >&2
                  echo true
                  return 0
                fi
              done
            done < "$RUNNER_TEMP/identity-diff"
            echo "No change touches the identity build closure." >&2
            echo false
          }
          if identity=$(classify); then
            :
          else
            echo "::notice title=Every native cell runs::The step log above states the reason."
            identity=true
          fi
          echo "identity=$identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        shell: bash
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # The race harness trusts the runner's go binary and build cache. This
      # step records the owner of that binary and the runner account.
      - name: Show Go binary owner
        shell: bash
        run: |
          go_binary="$(go env GOROOT)/bin/go"
          # shellcheck disable=SC2016 # PowerShell expands the single-quoted command.
          case "$RUNNER_OS" in
            Linux) stat -c 'owner=%U uid=%u path=%n' -- "$go_binary"; echo "runner=$(id -un) uid=$(id -u)" ;;
            macOS) stat -f 'owner=%Su uid=%u path=%N' -- "$go_binary"; echo "runner=$(id -un) uid=$(id -u)" ;;
            Windows) GO_BINARY="$go_binary.exe" pwsh -NoProfile -Command '"owner=$((Get-Acl -LiteralPath $env:GO_BINARY).Owner) runner=$([Security.Principal.WindowsIdentity]::GetCurrent().Name) path=$env:GO_BINARY"' ;;
          esac
      # The race harness also builds into this build cache. The build-v2 key
      # names an entry that holds the race harness outputs.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-build-v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - name: Session closure owner regressions
        id: session-closure
        if: runner.os != 'Windows'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          session_proof=$(mktemp -d "${RUNNER_TEMP:?}/ca8-session-closure.XXXXXXXX")
          printf 'evidence-path=%s\n' "$session_proof" >> "${GITHUB_OUTPUT:?}"
          OE_IDENTITY_SESSION_TEST_PROOF="$session_proof/evidence" python3 -I -B scripts/identity-qualification-session.test.py -v 2>&1 | tee "$session_proof/run.log"
      - name: Preserve session closure regression evidence
        if: always() && steps.session-closure.outputs.evidence-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-session-closure-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.session-closure.outputs.evidence-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Full race suite with owned Unix fixtures
        id: store-unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-identity-store-unix.sh race ${{ runner.os == 'Linux' && 'linux' || 'darwin' }} ${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
      - name: Full race suite with owned Windows fixtures
        id: store-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-identity-store-windows.ps1 -FixtureProfile race -ExpectedArchitecture amd64
      - name: Preserve identity store evidence
        if: always() && (steps.store-unix.outputs.evidence-path != '' || steps.store-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-store-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/volume/**
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/fixture.vhdx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: go vet ./...
      - run: go build -trimpath -o bin/oe${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/oe
      - name: Native npm package install
        run: npm run test:native -- bin/oe${{ runner.os == 'Windows' && '.exe' || '' }}
      - if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Keep the documented minimum Go line buildable while release builds use
  # the current stable patch release.
  minimum-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      # The harness downloads modules into its own fresh module cache, so this
      # job caches only the build cache that the harness reuses.
      - id: go-paths
        shell: bash
        run: echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-build-v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - name: Minimum Go full suite and six CGO0 builds
        id: store-unix
        shell: bash
        run: bash scripts/test-identity-store-unix.sh minimum linux amd64
      - name: Preserve identity store evidence
        if: always() && (steps.store-unix.outputs.evidence-path != '' || steps.store-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-store-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/volume/**
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/fixture.vhdx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Each cell runs actual native CGO0 storage code. Windows arm64 has no race cell.
  identity-store-native:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: linux, arch: arm64 }
          - { os: macos-26, target: darwin, arch: arm64 }
          - { os: macos-26-intel, target: darwin, arch: amd64 }
          - { os: windows-2025, target: windows, arch: amd64 }
          - { os: windows-11-arm, target: windows, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.target == 'darwin' && matrix.arch == 'amd64' && 45 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Native Unix storage suite
        id: store-unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-identity-store-unix.sh native ${{ matrix.target }} ${{ matrix.arch }}
      - name: Native Windows storage suite
        id: store-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-identity-store-windows.ps1 -FixtureProfile native -ExpectedArchitecture ${{ matrix.arch }}
      - name: Preserve identity store evidence
        if: always() && (steps.store-unix.outputs.evidence-path != '' || steps.store-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-store-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/volume/**
            !${{ steps.store-unix.outputs.evidence-path || steps.store-windows.outputs.evidence-path }}/fixture.vhdx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Each cell qualifies the real ordinary account and its actual default root.
  identity-default-native:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: linux, arch: arm64 }
          - { os: macos-26, target: darwin, arch: arm64 }
          - { os: macos-26-intel, target: darwin, arch: amd64 }
          - { os: windows-2025, target: windows, arch: amd64 }
          - { os: windows-11-arm, target: windows, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Actual ordinary Unix default location
        id: default-unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-identity-default-unix.sh ${{ matrix.target }} ${{ matrix.arch }}
      - name: Newly logged-on standard Windows default location
        id: default-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-identity-default-windows.ps1 -ExpectedArchitecture ${{ matrix.arch }}
      - name: Preserve bounded default-location evidence
        if: always() && (steps.default-unix.outputs.evidence-path != '' || steps.default-windows.outputs.evidence-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: identity-default-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ steps.default-unix.outputs.evidence-path || steps.default-windows.outputs.evidence-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The config loader runs on the node on PATH. It must work on the oldest
  # supported Node.js and on the current release.
  config-node:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "26.12.1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: go test -count=1 ./internal/config
      - if: steps.go-cache.outputs.cache-hit != 'true' && matrix.node == '26.12.1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - run: go mod tidy -diff
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run format:check
      - if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  homebrew:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/test-homebrew.sh

  # The one stable context for a ruleset. It requires every ungated job to
  # succeed. The native jobs can skip only when the classification selects none.
  checks:
    if: always()
    needs:
      [
        changes,
        go,
        minimum-go,
        identity-store-native,
        identity-default-native,
        config-node,
        packaging,
        homebrew,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          IDENTITY: ${{ needs.changes.outputs.identity }}
          UNGATED: >-
            changes=${{ needs.changes.result }}
            go=${{ needs.go.result }}
            minimum-go=${{ needs.minimum-go.result }}
            config-node=${{ needs.config-node.result }}
            packaging=${{ needs.packaging.result }}
            homebrew=${{ needs.homebrew.result }}
          GATED: >-
            identity-store-native=${{ needs.identity-store-native.result }}
            identity-default-native=${{ needs.identity-default-native.result }}
        run: |
          set -euo pipefail
          echo "identity=$IDENTITY"
          failed=0
          for entry in $UNGATED; do
            echo "$entry"
            [[ "${entry#*=}" == success ]] || failed=1
          done
          for entry in $GATED; do
            echo "$entry"
            case "$IDENTITY:${entry#*=}" in
              true:success | false:success | false:skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
