name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each dependency cache has its own restore and save steps. The steps have a
# 2-minute timeout and continue on error, so an unavailable cache service costs
# at most 2 minutes and a cold build. A setup action's built-in cache cannot be
# bounded apart from the tool download, so each setup action disables it.
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        shell: bash
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/oe${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/oe
      - name: Native npm package install
        run: npm run test:native -- bin/oe${{ runner.os == 'Windows' && '.exe' || '' }}
      - if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Keep the documented minimum Go line buildable while release builds use
  # the current stable patch release.
  minimum-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - run: go test ./...

  # The config loader runs on the node on PATH. It must work on the oldest
  # supported Node.js and on the current release.
  config-node:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "26.12.1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: go test -count=1 ./internal/config
      - if: steps.go-cache.outputs.cache-hit != 'true' && matrix.node == '26.12.1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - id: go-paths
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - run: go mod tidy -diff
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run format:check
      - if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-paths.outputs.modules }}
            ${{ steps.go-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  homebrew:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/test-homebrew.sh
