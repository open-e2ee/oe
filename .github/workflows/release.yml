name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # This job builds and publishes signed artifacts, so it restores no cache.
    # A cache that a CI job wrote could otherwise change the release build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Build release
        env:
          VERSION: ${{ github.ref_name }}
        run: node scripts/build-release.mjs "${VERSION#v}" dist
      - name: Generate CLI SBOM
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
        with:
          version: v1.10.0
          args: >-
            mod -licenses -std -short-purls -json -noserial -notimestamp
            -output dist/artifacts/cli-sbom.cdx.json .
      - name: Verify CLI SBOM
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/verify-release-sbom.mjs dist/artifacts/cli-sbom.cdx.json "${VERSION#v}"
          cd dist/artifacts
          sha256sum cli-sbom.cdx.json >> checksums.txt
          sort -o checksums.txt checksums.txt
      - name: Attest binaries and checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/artifacts/*
      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/artifacts/* --clobber
          else
            gh release create "$VERSION" dist/artifacts/* --verify-tag --generate-notes
          fi
      - name: Publish native packages
        run: |
          publish_package() {
            package_path="$1"
            package_spec=$(node -p "const p = require('./' + process.argv[1] + '/package.json'); p.name + '@' + p.version" "$package_path")
            if npm view "$package_spec" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "$package_spec already exists; skipping"
            else
              npm publish "$package_path" --provenance --access public
            fi
          }
          for package in dist/npm/oe-darwin-* dist/npm/oe-linux-* dist/npm/oe-win32-*; do
            publish_package "$package"
          done
      - name: Publish command
        run: |
          publish_package() {
            package_path="$1"
            package_spec=$(node -p "const p = require('./' + process.argv[1] + '/package.json'); p.name + '@' + p.version" "$package_path")
            if npm view "$package_spec" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "$package_spec already exists; skipping"
            else
              npm publish "$package_path" --provenance --access public
            fi
          }
          publish_package dist/npm/oe
